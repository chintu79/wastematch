name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: wastematch
          POSTGRES_PASSWORD: password
          POSTGRES_DB: wastematch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx ruff

    - name: Lint with Ruff
      working-directory: ./backend
      run: |
        ruff check .
        
    - name: Test with pytest
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://wastematch:password@localhost:5432/wastematch_test
      run: |
        PYTHONPATH=. pytest
